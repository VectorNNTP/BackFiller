name: Code Coverage

# Automatic coverage runs once, inside Build and Validate, on pull requests and
# pushes. This workflow remains for an explicit manual rerun and does not
# subscribe to push, so master does not run the suite twice.
# Coverage is collected only for test projects that already reference
# coverlet.collector. Today that is VectorNNTP.NNTPD.Tests.

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: coverage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Test and Code Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET SDK (repo pin)
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore solution
        run: dotnet restore VectorNNTP.NNTPD.sln

      - name: Build solution
        run: dotnet build VectorNNTP.NNTPD.sln --configuration Release --no-restore

      - name: Test solution with coverage where the collector is already referenced
        timeout-minutes: 25
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          while IFS= read -r proj; do
            name="$(basename "$proj" .csproj)"
            echo "Testing $name"
            if grep -q 'coverlet.collector' "$proj"; then
              if ! dotnet test "$proj" \
                --configuration Release \
                --no-build \
                --no-restore \
                --collect:"XPlat Code Coverage" \
                --results-directory ./TestResults \
                --logger "trx;LogFileName=${name}.trx"; then
                echo "Tests failed: $name"
                failed=1
              fi
            else
              if ! dotnet test "$proj" \
                --configuration Release \
                --no-build \
                --no-restore \
                --results-directory ./TestResults \
                --logger "trx;LogFileName=${name}.trx"; then
                echo "Tests failed: $name"
                failed=1
              fi
            fi
          done < <(find tests -name '*.csproj' | sort)
          exit "$failed"

      - name: Verify every test project reported results
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test_count="$(find tests -name '*.csproj' | wc -l | tr -d '[:space:]')"
          coverlet_count=0
          while IFS= read -r proj; do
            if grep -q 'coverlet.collector' "$proj"; then
              coverlet_count=$((coverlet_count + 1))
            fi
          done < <(find tests -name '*.csproj' | sort)
          trx_count=0
          cov_count=0
          if [ -d TestResults ]; then
            trx_count="$(find TestResults -name '*.trx' | wc -l | tr -d '[:space:]')"
            cov_count="$(find TestResults -name 'coverage.cobertura.xml' | wc -l | tr -d '[:space:]')"
          fi
          echo "test projects=$test_count coverlet projects=$coverlet_count trx=$trx_count coverage=$cov_count"
          if [ "$trx_count" -lt "$test_count" ]; then
            echo "Expected at least one TRX file per test project."
            exit 1
          fi
          if [ "$coverlet_count" -eq 0 ]; then
            echo "No test project references coverlet.collector, so coverage cannot be collected."
            exit 1
          fi
          if [ "$cov_count" -lt "$coverlet_count" ]; then
            echo "Expected at least one Cobertura file per test project that references coverlet.collector."
            exit 1
          fi

      - name: Generate coverage report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          dotnet tool install --global dotnet-reportgenerator-globaltool
          reportgenerator \
            "-reports:TestResults/**/coverage.cobertura.xml" \
            "-targetdir:TestResults/CoverageReport" \
            "-reporttypes:Html;Cobertura;TextSummary"

      - name: Add coverage summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f TestResults/CoverageReport/Summary.txt ]]; then
            echo "Coverage summary was not produced."
            exit 1
          fi
          cat TestResults/CoverageReport/Summary.txt
          {
            echo "## Code Coverage"
            echo
            echo '```text'
            cat TestResults/CoverageReport/Summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: code-coverage-report
          path: TestResults/CoverageReport/
          if-no-files-found: error
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/**/*.trx
          if-no-files-found: error
          retention-days: 14
