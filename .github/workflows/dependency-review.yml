name: Dependency Review

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          # Current policy: block PRs introducing high/critical dependency vulnerabilities.
          # Lower-severity findings remain visible for reviewer triage without automatic PR blocking.
          fail-on-severity: high
